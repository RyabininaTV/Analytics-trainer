    UserResponse:
      type: object
      required:
      - id
      - email
      - username
      - role
      - status
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/UserRoleEnum"
        status:
          $ref: "#/components/schemas/UserStatusEnum"
    UserRoleEnum:
      type: string
      enum:
      - USER
      - ADMIN
    UserStatusEnum:
      type: string
      enum:
      - ACTIVE
      - BLOCKED
paths:
  /admin/tasks:
    post:
      summary: Создание нового задания
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTaskResponse"
        "400":
          description: Bad Request
      tags:
      - Admin Controller
  /admin/tasks/{id}:
    put:
      summary: Редактирование задания
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateTaskResponse"
        "400":
          description: Bad Request
      tags:
      - Admin Controller
    delete:
      summary: Удаление задания
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204": {}
      tags:
      - Admin Controller
  /admin/trainers:
    post:
      summary: Создание нового тренажера
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTrainerRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTrainerResponse"
        "400":
          description: Bad Request
      tags:
      - Admin Controller
  /admin/trainers/{id}:
    put:
      summary: Редактирование тренажера
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTrainerRequest"
        required: true
      responses:
        "200":
