---
openapi: 3.1.0
components:
  schemas:
    AnswerTypeEnum:
      type: string
      enum:
      - TEST_OPTION
      - ERROR_ITEM
      - OPEN_TEXT
    AttemptAnswerDetails:
      type: object
      required:
      - id
      - answer_type
      properties:
        id:
          type: integer
          format: int64
        answer_type:
          $ref: "#/components/schemas/AnswerTypeEnum"
        selected_option_id:
          type: integer
          format: int64
        selected_option_text:
          type: string
        selected_error_item_id:
          type: integer
          format: int64
        selected_error_item_text:
          type: string
        text_answer:
          type: string
    AttemptDetailsResponse:
      type: object
      required:
      - id
      - user_id
      - task_id
      - started_at
      - status
      - max_score_snapshot
      - answers
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        task_id:
          type: integer
          format: int64
        started_at:
          $ref: "#/components/schemas/LocalDateTime"
        submitted_at:
          $ref: "#/components/schemas/LocalDateTime"
        status:
          $ref: "#/components/schemas/AttemptStatusEnum"
        score:
          type: integer
          format: int32
        max_score_snapshot:
          type: integer
          format: int32
        is_correct:
          type: boolean
        auto_checked:
          type: boolean
        needs_manual_review:
          type: boolean
        reviewer_comment:
          type: string
        reviewed_at:
          $ref: "#/components/schemas/LocalDateTime"
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AttemptAnswerDetails"
    AttemptResponse:
      type: object
      required:
      - id
      - task_id
      - started_at
      - status
      - max_score_snapshot
      properties:
        id:
          type: integer
          format: int64
        task_id:
          type: integer
          format: int64
        started_at:
          $ref: "#/components/schemas/LocalDateTime"
        submitted_at:
          $ref: "#/components/schemas/LocalDateTime"
        status:
          $ref: "#/components/schemas/AttemptStatusEnum"
        score:
          type: integer
          format: int32
        max_score_snapshot:
          type: integer
          format: int32
        is_correct:
          type: boolean
    AttemptStatusEnum:
      type: string
      enum:
      - IN_PROGRESS
      - SUBMITTED
      - CHECKED
      - REJECTED
    AuthResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - user
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: "#/components/schemas/UserResponse"
    CreateTaskErrorItemRequest:
      type: object
      required:
      - fragment_text
      - is_error
      properties:
        fragment_text:
          type: string
          pattern: \S
        is_error:
          type: boolean
        explanation:
          type: string
    CreateTaskErrorItemResponse:
      type: object
      required:
      - id
      - fragment_text
      - is_error
      properties:
        id:
          type: integer
          format: int64
        fragment_text:
          type: string
        is_error:
          type: boolean
        explanation:
          type: string
    CreateTaskOptionRequest:
      type: object
      required:
      - option_text
      - is_correct
      properties:
        option_text:
          type: string
          pattern: \S
        is_correct:
          type: boolean
    CreateTaskOptionResponse:
      type: object
      required:
      - id
      - option_text
      - is_correct
      properties:
        id:
          type: integer
          format: int64
        option_text:
          type: string
        is_correct:
          type: boolean
    CreateTaskRequest:
      type: object
      required:
      - trainer_id
      - task_type
      - title
      - description
      - max_score
      - is_active
      - auto_check_enabled
      properties:
        trainer_id:
          type: integer
          format: int64
          exclusiveMinimum: 0
        task_type:
          type: string
          pattern: TEST|ERROR_FIND|OPEN
        title:
          type: string
          pattern: \S
          maxLength: 255
        description:
          type: string
          pattern: \S
        content:
          type: string
        max_score:
          type: integer
          format: int32
          minimum: 0
        is_active:
          type: boolean
        auto_check_enabled:
          type: boolean
        options:
          type: array
          items:
            $ref: "#/components/schemas/CreateTaskOptionRequest"
        error_items:
          type: array
          items:
            $ref: "#/components/schemas/CreateTaskErrorItemRequest"
    CreateTaskResponse:
      type: object
      required:
      - id
      - trainer_id
      - task_type
      - title
      - description
      - max_score
      - is_active
      - auto_check_enabled
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        trainer_id:
          type: integer
          format: int64
        task_type:
          type: string
        title:
          type: string
        description:
          type: string
        content:
          type: string
        max_score:
          type: integer
          format: int32
        is_active:
          type: boolean
        auto_check_enabled:
          type: boolean
        created_at:
          $ref: "#/components/schemas/LocalDateTime"
        updated_at:
          $ref: "#/components/schemas/LocalDateTime"
        options:
          type: array
          items:
            $ref: "#/components/schemas/CreateTaskOptionResponse"
        error_items:
          type: array
          items:
            $ref: "#/components/schemas/CreateTaskErrorItemResponse"
    CreateTrainerRequest:
      type: object
      required:
      - title
      - is_active
      properties:
        title:
          type: string
          pattern: \S
        description:
          type: string
        difficulty_level:
          type: string
          pattern: EASY|MEDIUM|HARD
        is_active:
          type: boolean
    CreateTrainerResponse:
      type: object
      required:
      - id
      - title
      - is_active
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        difficulty_level:
          type: string
        is_active:
          type: boolean
        created_at:
          $ref: "#/components/schemas/LocalDateTime"
        updated_at:
          $ref: "#/components/schemas/LocalDateTime"
    GetRandomTaskErrorItemResponse:
      type: object
      required:
      - id
      - fragment_text
      properties:
        id:
          type: integer
          format: int64
        fragment_text:
          type: string
    GetRandomTaskOptionResponse:
      type: object
      required:
      - id
      - option_text
      properties:
        id:
          type: integer
          format: int64
        option_text:
          type: string
    GetRandomTaskResponse:
      type: object
      required:
      - id
      - trainer_id
      - trainer_title
      - task_type
      - title
      - description
      - max_score
      - auto_check_enabled
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        trainer_id:
          type: integer
          format: int64
        trainer_title:
          type: string
        task_type:
          type: string
        title:
          type: string
        description:
          type: string
        content:
          type: string
        max_score:
          type: integer
          format: int32
        auto_check_enabled:
          type: boolean
        created_at:
          $ref: "#/components/schemas/LocalDateTime"
        updated_at:
          $ref: "#/components/schemas/LocalDateTime"
        options:
          type: array
          items:
            $ref: "#/components/schemas/GetRandomTaskOptionResponse"
        error_items:
          type: array
          items:
            $ref: "#/components/schemas/GetRandomTaskErrorItemResponse"
    GetTaskDetailsResponse:
      type: object
      required:
      - id
      - trainer_id
      - trainer_title
      - task_type
      - title
      - description
      - max_score
      - auto_check_enabled
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        trainer_id:
          type: integer
          format: int64
        trainer_title:
          type: string
        task_type:
          type: string
        title:
          type: string
        description:
          type: string
        content:
          type: string
        max_score:
          type: integer
          format: int32
        auto_check_enabled:
          type: boolean
        created_at:
          $ref: "#/components/schemas/LocalDateTime"
        updated_at:
          $ref: "#/components/schemas/LocalDateTime"
        options:
          type: array
          items:
            $ref: "#/components/schemas/GetTaskOptionResponse"
        error_items:
          type: array
          items:
            $ref: "#/components/schemas/GetTaskErrorItemResponse"
    GetTaskErrorItemResponse:
      type: object
      required:
      - id
      - fragment_text
      properties:
        id:
          type: integer
          format: int64
        fragment_text:
          type: string
    GetTaskItemResponse:
      type: object
      required:
      - id
      - trainer_id
      - trainer_title
      - task_type
      - title
      - description
      - max_score
      - auto_check_enabled
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        trainer_id:
          type: integer
          format: int64
        trainer_title:
          type: string
        task_type:
          type: string
        title:
          type: string
        description:
          type: string
        content:
          type: string
        max_score:
          type: integer
          format: int32
        auto_check_enabled:
          type: boolean
        created_at:
          $ref: "#/components/schemas/LocalDateTime"
        updated_at:
          $ref: "#/components/schemas/LocalDateTime"
    GetTaskOptionResponse:
      type: object
      required:
      - id
      - option_text
      properties:
        id:
          type: integer
          format: int64
        option_text:
          type: string
    LeaderboardItemResponse:
      type: object
      required:
      - position
      - user_id
      - username
      - completed_tasks_count
      - total_tasks_count
      - total_score
      - completion_percent
      properties:
        position:
          type: integer
          format: int32
        user_id:
          type: integer
          format: int64
        username:
          type: string
        completed_tasks_count:
          type: integer
          format: int32
        total_tasks_count:
          type: integer
          format: int32
        total_score:
          type: integer
          format: int32
        completion_percent:
          type: number
        last_activity_at:
          $ref: "#/components/schemas/LocalDateTime"
    LocalDateTime:
      type: string
      format: date-time
      examples:
      - 2022-03-10T12:15:50
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          pattern: \S
          maxLength: 255
        password:
          type: string
          pattern: \S
          maxLength: 100
    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
    ProfileResponse:
      type: object
      required:
      - id
      - email
      - username
      - role
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/UserRoleEnum"
        status:
          $ref: "#/components/schemas/UserStatusEnum"
        created_at:
          $ref: "#/components/schemas/LocalDateTime"
        updated_at:
          $ref: "#/components/schemas/LocalDateTime"
    ProgressHistoryItemResponse:
      type: object
      required:
      - changed_at
      - total_score
      properties:
        changed_at:
          $ref: "#/components/schemas/LocalDateTime"
        total_score:
          type: integer
          format: int32
    ProgressItemResponse:
      type: object
      required:
      - trainer_id
      - completed_tasks_count
      - total_tasks_count
      - total_score
      - completion_percent
      properties:
        trainer_id:
          type: integer
          format: int64
        completed_tasks_count:
          type: integer
          format: int32
        total_tasks_count:
          type: integer
          format: int32
        total_score:
          type: integer
          format: int32
        completion_percent:
          type: number
        last_activity_at:
          $ref: "#/components/schemas/LocalDateTime"
    ProgressResponse:
      type: object
      required:
      - completed_tasks_count
      - total_tasks_count
      - total_score
      - completion_percent
      properties:
        completed_tasks_count:
          type: integer
          format: int32
        total_tasks_count:
          type: integer
          format: int32
        total_score:
          type: integer
          format: int32
        completion_percent:
          type: number
        last_activity_at:
          $ref: "#/components/schemas/LocalDateTime"
    RefreshRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          pattern: \S
    RegisterRequest:
      type: object
      required:
      - email
      - username
      - password
      properties:
        email:
          type: string
          pattern: \S
          maxLength: 255
        username:
          type: string
          pattern: \S
          minLength: 3
          maxLength: 100
        password:
          type: string
          pattern: \S
          minLength: 8
          maxLength: 100
    SubmitAttemptRequest:
      type: object
      required:
      - task_id
      - answer
      properties:
        task_id:
          type: integer
          format: int64
          exclusiveMinimum: 0
        answer:
          type: string
          pattern: \S
          maxLength: 10000
    SubmitAttemptResponse:
      type: object
      required:
      - task_id
      - user_id
      - attempt_id
      - status
      properties:
        task_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        attempt_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/AttemptStatusEnum"
        score:
          type: integer
          format: int32
        total_score:
          type: integer
          format: int32
    TaskByTrainerIdResponse:
      type: object
      required:
      - id
      - trainer_id
      - task_type
      - title
      - description
      - max_score
      - is_active
      - auto_check_enabled
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        trainer_id:
          type: integer
          format: int64
        task_type:
          $ref: "#/components/schemas/TaskTypeEnum"
        title:
          type: string
        description:
          type: string
        content:
          type: string
        max_score:
          type: integer
          format: int32
        is_active:
          type: boolean
        auto_check_enabled:
          type: boolean
        created_at:
          $ref: "#/components/schemas/LocalDateTime"
        updated_at:
          $ref: "#/components/schemas/LocalDateTime"
    TaskTypeEnum:
      type: string
      enum:
      - TEST
      - ERROR_FIND
      - OPEN
    TrainerInfoByIdResponse:
      type: object
      required:
      - id
      - title
      - is_active
      - created_at
      - updated_at
      properties:
        id:
