          format: int64
        title:
          type: string
        description:
          type: string
        difficulty_level:
          type: string
        is_active:
          type: boolean
        created_at:
          $ref: "#/components/schemas/LocalDateTime"
        updated_at:
          $ref: "#/components/schemas/LocalDateTime"
    TrainerResponse:
      type: object
      required:
      - id
      - title
      - is_active
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        difficulty_level:
          type: string
        is_active:
          type: boolean
        created_at:
          $ref: "#/components/schemas/LocalDateTime"
        updated_at:
          $ref: "#/components/schemas/LocalDateTime"
    UpdateProfileRequest:
      type: object
      required:
      - email
      - username
      properties:
        email:
          type: string
          pattern: \S
          maxLength: 255
        username:
          type: string
          pattern: \S
          minLength: 3
          maxLength: 100
        old_password:
          type: string
          minLength: 8
          maxLength: 100
        new_password:
          type: string
          minLength: 8
          maxLength: 100
    UpdateProfileResponse:
      type: object
      required:
      - id
      - email
      - username
      - role
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/UserRoleEnum"
        status:
          $ref: "#/components/schemas/UserStatusEnum"
        created_at:
          $ref: "#/components/schemas/LocalDateTime"
        updated_at:
          $ref: "#/components/schemas/LocalDateTime"
    UpdateTaskErrorItemRequest:
      type: object
      required:
      - fragment_text
      - is_error
      properties:
        fragment_text:
          type: string
          pattern: \S
        is_error:
          type: boolean
        explanation:
          type: string
    UpdateTaskErrorItemResponse:
      type: object
      required:
      - id
      - fragment_text
      - is_error
      properties:
        id:
          type: integer
          format: int64
        fragment_text:
          type: string
        is_error:
          type: boolean
        explanation:
          type: string
    UpdateTaskOptionRequest:
      type: object
      required:
      - option_text
      - is_correct
      properties:
        option_text:
          type: string
          pattern: \S
        is_correct:
          type: boolean
    UpdateTaskOptionResponse:
      type: object
      required:
      - id
      - option_text
      - is_correct
      properties:
        id:
          type: integer
          format: int64
        option_text:
          type: string
        is_correct:
          type: boolean
    UpdateTaskRequest:
      type: object
      required:
      - trainer_id
      - task_type
      - title
      - description
      - max_score
      - is_active
      - auto_check_enabled
      properties:
        trainer_id:
          type: integer
          format: int64
          exclusiveMinimum: 0
        task_type:
          type: string
          pattern: TEST|ERROR_FIND|OPEN
        title:
          type: string
          pattern: \S
          maxLength: 255
        description:
          type: string
          pattern: \S
        content:
          type: string
        max_score:
          type: integer
          format: int32
          minimum: 0
        is_active:
          type: boolean
        auto_check_enabled:
          type: boolean
        options:
          type: array
          items:
            $ref: "#/components/schemas/UpdateTaskOptionRequest"
        error_items:
          type: array
          items:
            $ref: "#/components/schemas/UpdateTaskErrorItemRequest"
    UpdateTaskResponse:
      type: object
      required:
      - id
      - trainer_id
      - task_type
      - title
      - description
      - max_score
      - is_active
      - auto_check_enabled
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        trainer_id:
          type: integer
          format: int64
        task_type:
          type: string
        title:
          type: string
        description:
          type: string
        content:
          type: string
        max_score:
          type: integer
          format: int32
        is_active:
          type: boolean
        auto_check_enabled:
          type: boolean
        created_at:
          $ref: "#/components/schemas/LocalDateTime"
        updated_at:
          $ref: "#/components/schemas/LocalDateTime"
        options:
          type: array
          items:
            $ref: "#/components/schemas/UpdateTaskOptionResponse"
        error_items:
          type: array
          items:
            $ref: "#/components/schemas/UpdateTaskErrorItemResponse"
    UpdateTrainerRequest:
      type: object
      required:
      - title
      - is_active
      properties:
        title:
          type: string
          pattern: \S
          maxLength: 255
        description:
          type: string
        difficulty_level:
          type: string
          pattern: EASY|MEDIUM|HARD
        is_active:
          type: boolean
    UpdateTrainerResponse:
      type: object
      required:
      - id
      - title
      - is_active
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        difficulty_level:
          type: string
        is_active:
          type: boolean
        created_at:
          $ref: "#/components/schemas/LocalDateTime"
        updated_at:
          $ref: "#/components/schemas/LocalDateTime"
    UserProgressByTrainerIdResponse:
      type: object
      required:
      - id
      - user_id
      - trainer_id
      - completed_tasks_count
      - total_tasks_count
      - total_score
