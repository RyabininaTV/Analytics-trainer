---
openapi: 3.1.0
components:
  schemas:
    CreateTaskErrorItemRequest:
      type: object
      required:
      - fragment_text
      - is_error
      properties:
        fragment_text:
          type: string
          pattern: \S
        is_error:
          type: boolean
        explanation:
          type: string
    CreateTaskOptionRequest:
      type: object
      required:
      - option_text
      - is_correct
      properties:
        option_text:
          type: string
          pattern: \S
        is_correct:
          type: boolean
    CreateTaskRequest:
      type: object
      required:
      - trainer_id
      - task_type
      - title
      - description
      - max_score
      - is_active
      - auto_check_enabled
      properties:
        trainer_id:
          type: integer
          format: int64
          exclusiveMinimum: 0
        task_type:
          type: string
          pattern: TEST|ERROR_FIND|OPEN
        title:
          type: string
          pattern: \S
          maxLength: 255
        description:
          type: string
          pattern: \S
        content:
          type: string
        max_score:
          type: integer
          format: int32
          minimum: 0
        is_active:
          type: boolean
        auto_check_enabled:
          type: boolean
        options:
          type: array
          items:
            $ref: "#/components/schemas/CreateTaskOptionRequest"
        error_items:
          type: array
          items:
            $ref: "#/components/schemas/CreateTaskErrorItemRequest"
    CreateTrainerRequest:
      type: object
      required:
      - title
      - is_active
      properties:
        title:
          type: string
          pattern: \S
        description:
          type: string
        difficulty_level:
          type: string
          pattern: EASY|MEDIUM|HARD
        is_active:
          type: boolean
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          pattern: \S
          maxLength: 255
        password:
          type: string
          pattern: \S
          maxLength: 100
    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
    RefreshRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          pattern: \S
    RegisterRequest:
      type: object
      required:
      - email
      - username
      - password
      properties:
        email:
          type: string
          pattern: \S
          maxLength: 255
        username:
          type: string
          pattern: \S
          minLength: 3
          maxLength: 100
        password:
          type: string
          pattern: \S
          minLength: 8
          maxLength: 100
    SubmitAttemptRequest:
      type: object
      required:
      - task_id
      - answer
      properties:
        task_id:
          type: integer
          format: int64
          exclusiveMinimum: 0
        answer:
          type: string
          pattern: \S
          maxLength: 10000
    UpdateProfileRequest:
      type: object
      required:
      - email
      - username
      properties:
        email:
          type: string
          pattern: \S
          maxLength: 255
        username:
          type: string
          pattern: \S
          minLength: 3
          maxLength: 100
        old_password:
          type: string
          minLength: 8
          maxLength: 100
        new_password:
          type: string
          minLength: 8
          maxLength: 100
    UpdateTaskErrorItemRequest:
      type: object
      required:
      - fragment_text
      - is_error
      properties:
        fragment_text:
          type: string
          pattern: \S
        is_error:
          type: boolean
        explanation:
          type: string
    UpdateTaskOptionRequest:
      type: object
      required:
      - option_text
      - is_correct
      properties:
        option_text:
          type: string
          pattern: \S
        is_correct:
          type: boolean
    UpdateTaskRequest:
      type: object
      required:
      - trainer_id
      - task_type
      - title
      - description
      - max_score
      - is_active
      - auto_check_enabled
      properties:
        trainer_id:
          type: integer
          format: int64
          exclusiveMinimum: 0
        task_type:
          type: string
          pattern: TEST|ERROR_FIND|OPEN
        title:
          type: string
          pattern: \S
          maxLength: 255
        description:
          type: string
          pattern: \S
        content:
          type: string
        max_score:
          type: integer
          format: int32
          minimum: 0
        is_active:
          type: boolean
        auto_check_enabled:
          type: boolean
        options:
          type: array
          items:
            $ref: "#/components/schemas/UpdateTaskOptionRequest"
        error_items:
          type: array
          items:
            $ref: "#/components/schemas/UpdateTaskErrorItemRequest"
    UpdateTrainerRequest:
      type: object
      required:
      - title
      - is_active
      properties:
        title:
          type: string
          pattern: \S
          maxLength: 255
        description:
          type: string
        difficulty_level:
          type: string
          pattern: EASY|MEDIUM|HARD
        is_active:
          type: boolean
paths:
  /admin/tasks:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      summary: Create Task
      tags:
      - Admin Controller
  /admin/tasks/{id}:
    put:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      summary: Update Task
      tags:
      - Admin Controller
    delete:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      summary: Delete Task
      tags:
      - Admin Controller
  /admin/trainers:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTrainerRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      summary: Create Trainer
      tags:
      - Admin Controller
  /admin/trainers/{id}:
    put:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTrainerRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      summary: Update Trainer
      tags:
      - Admin Controller
  /attempts:
    post:
      summary: Отправка ответа на задание
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAttemptRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      tags:
      - Attempt Controller
    get:
      summary: Получение истории всех попыток пользователя
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      tags:
      - Attempt Controller
  /attempts/{id}/details:
    get:
      summary: Детали попытки (включая ответ)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      tags:
      - Attempt Controller
  /attempts/{taskId}:
    get:
      summary: Получение всех попыток по конкретному заданию
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      tags:
      - Attempt Controller
  /auth/login:
    post:
      summary: Вход пользователя
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      tags:
      - Auth Controller
  /auth/logout:
    post:
      summary: Выход пользователя
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      tags:
      - Auth Controller
  /auth/refresh:
    post:
      summary: Обновление токенов
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      tags:
      - Auth Controller
  /auth/register:
    post:
      summary: Регистрация пользователя
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      tags:
      - Auth Controller
  /leaderboard:
    get:
      summary: Глобальный рейтинг всех пользователей
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      tags:
      - Leaderboard Controller
  /leaderboard/{trainerId}:
    get:
      parameters:
      - name: trainerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      summary: Get Leaderboard By Trainer
      tags:
      - Leaderboard Controller
  /profile:
    put:
      summary: Обновление профиля пользователя
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      tags:
      - Profile Controller
    get:
      summary: Получение профиля пользователя
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      tags:
      - Profile Controller
  /progress:
    get:
      summary: Получение общего прогресса пользователя
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      tags:
      - Progress Controller
  /progress/histrory:
    get:
      summary: История изменения прогресса пользователя
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      tags:
      - Progress Controller
  /progress/trainers:
    get:
      summary: Прогресс пользователя по всем тренажерам
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      tags:
      - Progress Controller
  /tasks:
    get:
      summary: Список всех заданий
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      tags:
      - Tasks Controller
  /tasks/random:
    get:
      summary: Получение деталей случайной задачи
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      tags:
      - Tasks Controller
  /tasks/{id}:
    get:
      summary: Получение деталей задачи по id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      tags:
      - Tasks Controller
  /trainers:
    get:
      summary: Получение списка всех тренажеров
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      tags:
      - Trainer Controller
  /trainers/{id}:
    get:
      summary: Получение информации о тренажере по ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      tags:
      - Trainer Controller
  /trainers/{id}/progress:
    get:
      summary: Получение прогресса пользователя по ID тренажера
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      tags:
      - Trainer Controller
  /trainers/{id}/reset:
    post:
      summary: Сброс прогресса пользователя по ID тренажера
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      tags:
      - Trainer Controller
  /trainers/{id}/tasks:
    get:
      summary: Получение задач тренажера по ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      tags:
      - Trainer Controller
info:
  title: Analytics-trainer API
  version: 1.0-SNAPSHOT
servers:
- url: http://localhost:8080
  description: Auto generated value
- url: http://0.0.0.0:8080
  description: Auto generated value
